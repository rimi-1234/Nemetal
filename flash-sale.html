<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Sale - Easycon BD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e84610'/><text y='72' x='12' font-size='68' font-weight='900' fill='white' font-family='sans-serif'>E</text></svg>">
</head>
<body>
<div id="mobile-menu-placeholder"></div>
<div id="cart-drawer-placeholder"></div>
<div id="header-placeholder"></div>

<!-- FLASH SALE HERO -->
<div style="background:linear-gradient(135deg,var(--secondary) 0%,#243558 60%,rgba(232,70,16,0.3) 100%);padding:48px 0;position:relative;overflow:hidden;">
  <div style="position:absolute;right:-50px;top:-50px;width:400px;height:400px;border-radius:50%;background:rgba(232,70,16,0.08);"></div>
  <div class="container-xl">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-4">
      <div>
        <div style="display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:white;padding:8px 20px;border-radius:50px;font-size:18px;font-weight:900;box-shadow:var(--shadow-primary-lg);margin-bottom:12px;">
          <i class="bi bi-lightning-fill" style="animation:flash-pulse 1s infinite;"></i> FLASH SALE
        </div>
        <h1 style="font-size:36px;font-weight:900;color:white;margin-bottom:8px;">Crazy Deals Today!</h1>
        <p style="font-size:16px;color:rgba(255,255,255,0.8);margin:0;">Up to 40% off on premium construction materials</p>
      </div>
      <div>
        <div style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.7);margin-bottom:8px;text-align:center;">⏰ Sale ends in:</div>
        <div class="flash-countdown" data-countdown="auto">
          <div class="countdown-block"><span class="countdown-num" data-hours>00</span><span class="countdown-label">Hours</span></div>
          <span class="countdown-sep">:</span>
          <div class="countdown-block"><span class="countdown-num" data-mins>00</span><span class="countdown-label">Mins</span></div>
          <span class="countdown-sep">:</span>
          <div class="countdown-block"><span class="countdown-num" data-secs>00</span><span class="countdown-label">Secs</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- BREADCRUMB -->
<div style="background:white;border-bottom:1px solid var(--gray-200);padding:12px 0;">
  <div class="container-xl">
    <ul class="breadcrumb-custom">
      <li><a href="index.html">Home</a></li>
      <li class="active">Flash Sale</li>
    </ul>
  </div>
</div>

<!-- PRODUCTS -->
<section class="section">
  <div class="container-xl">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
      <h2 style="font-size:22px;font-weight:800;margin:0;">🔥 Today's Flash Deals</h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <span style="font-size:13px;color:var(--gray-500);">Sort by:</span>
        <select onchange="sortFlashSaleProducts(this.value)" style="padding:8px 12px;border:2px solid var(--gray-200);border-radius:8px;font-size:13px;outline:none;color:var(--gray-700);">
          <option value="discount">Highest Discount</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="rating">Best Rated</option>
        </select>
      </div>
    </div>
    <div id="flash-products" class="products-grid"></div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data/products.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
renderSharedComponents('flash-sale');
document.addEventListener('DOMContentLoaded', async () => {
  await loadProductsToGrid('flash-products', { flashSale: true });
});

function sortFlashSaleProducts(type) {
  const grid = document.getElementById('flash-products');
  const cards = Array.from(grid.querySelectorAll('.product-card'));
  // Re-render with sort (placeholder)
  showToast('Sorted!', 'info', 'Products sorted by ' + type);
}
</script>
</body>
</html>
