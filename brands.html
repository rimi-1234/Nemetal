<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Brands - Easycon BD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e84610'/><text y='72' x='12' font-size='68' font-weight='900' fill='white' font-family='sans-serif'>E</text></svg>">
</head>
<body>
<div id="mobile-menu-placeholder"></div>
<div id="cart-drawer-placeholder"></div>
<div id="header-placeholder"></div>

<!-- PAGE BANNER -->
<div class="page-banner">
  <div class="container-xl">
    <h1><i class="bi bi-award-fill me-3" style="color:var(--primary);"></i>All Brands</h1>
    <ul class="breadcrumb-custom">
      <li><a href="index.html">Home</a></li>
      <li class="active">All Brands</li>
    </ul>
  </div>
</div>

<!-- FEATURED BRANDS -->
<section class="section section-bg-white">
  <div class="container-xl">
    <div class="section-header">
      <div class="section-title-group">
        <span class="section-label">Top Picks</span>
        <h2 class="section-title">Featured Brands</h2>
      </div>
    </div>
    <div class="row g-4" id="featured-brands-grid">
      <!-- Loaded by JS -->
    </div>
  </div>
</section>

<!-- ALL BRANDS -->
<section class="section">
  <div class="container-xl">
    <!-- Search -->
    <div style="margin-bottom:24px;">
      <div style="display:flex;align-items:center;gap:8px;background:white;border:2px solid var(--gray-200);border-radius:50px;padding:10px 20px;max-width:400px;transition:border-color 0.25s;" onfocus-within="this.style.borderColor='var(--primary)'">
        <i class="bi bi-search" style="color:var(--gray-400);"></i>
        <input type="text" placeholder="Search brands..." id="brand-search" style="border:none;outline:none;font-size:14px;flex:1;" oninput="filterBrands(this.value)">
      </div>
    </div>

    <!-- Brand Grid -->
    <div class="row g-4" id="all-brands-grid">
      <!-- Loaded by JS -->
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data/products.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
renderSharedComponents('brands');

const BRAND_COLORS = ['#e84610','#0066cc','#003087','#1b2a4a','#7c3aed','#059669','#b45309','#0f172a','#0369a1','#dc2626','#374151','#fbbf24','#0891b2','#d97706','#65a30d','#9333ea'];

function renderBrandCard(brand, idx) {
  const color = BRAND_COLORS[idx % BRAND_COLORS.length];
  return `
    <div class="col-6 col-sm-4 col-md-3 col-lg-2">
      <a href="product-listing.html?brand=${brand.slug}" class="brand-card d-flex flex-column align-items-center justify-content-center text-decoration-none" style="height:110px;gap:8px;">
        <div style="width:50px;height:50px;border-radius:12px;background:${color}15;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:13px;font-weight:900;color:${color};">${brand.name.substring(0,2).toUpperCase()}</span>
        </div>
        <span class="brand-name-text" style="font-size:13px;font-weight:700;color:var(--gray-700);text-align:center;">${brand.name}</span>
      </a>
    </div>
  `;
}

function renderFeaturedBrandCard(brand, idx) {
  const color = BRAND_COLORS[idx % BRAND_COLORS.length];
  return `
    <div class="col-6 col-md-4 col-lg-3">
      <a href="product-listing.html?brand=${brand.slug}" class="text-decoration-none">
        <div class="feature-card" style="border-top:4px solid ${color};">
          <div class="icon-wrap" style="background:${color}15;color:${color};">
            <span style="font-size:22px;font-weight:900;">${brand.name.substring(0,2).toUpperCase()}</span>
          </div>
          <h4>${brand.name}</h4>
          <p style="font-size:13px;color:var(--gray-500);">View all products from ${brand.name}</p>
          <span style="font-size:12px;font-weight:600;color:${color};">Browse Products →</span>
        </div>
      </a>
    </div>
  `;
}

document.addEventListener('DOMContentLoaded', async () => {
  const brands = DUMMY_DATA.brands;
  const featured = brands.filter(b => b.featured);
  const all = brands;

  document.getElementById('featured-brands-grid').innerHTML = featured.map((b,i) => renderFeaturedBrandCard(b,i)).join('');
  document.getElementById('all-brands-grid').innerHTML = all.map((b,i) => renderBrandCard(b,i)).join('');
});

function filterBrands(query) {
  const q = query.toLowerCase();
  const cards = document.querySelectorAll('#all-brands-grid > div');
  cards.forEach(card => {
    const name = card.querySelector('.brand-name-text')?.textContent.toLowerCase() || '';
    card.style.display = name.includes(q) ? '' : 'none';
  });
}
</script>
</body>
</html>
