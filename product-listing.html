<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Easycon BD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e84610'/><text y='72' x='12' font-size='68' font-weight='900' fill='white' font-family='sans-serif'>E</text></svg>">
</head>
<body>
<div id="mobile-menu-placeholder"></div>
<div id="cart-drawer-placeholder"></div>
<div id="header-placeholder"></div>

<!-- PAGE BANNER -->
<div class="page-banner">
  <div class="container-xl">
    <h1 id="page-title">All Products</h1>
    <ul class="breadcrumb-custom">
      <li><a href="index.html">Home</a></li>
      <li><a href="categories.html">Categories</a></li>
      <li class="active" id="bread-current">All Products</li>
    </ul>
  </div>
</div>

<!-- PRODUCTS SECTION -->
<section class="section">
  <div class="container-xl">
    <div class="row g-4">
      <!-- SIDEBAR FILTER -->
      <div class="col-lg-3 d-none d-lg-block">
        <div class="filter-sidebar">
          <h5 style="font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
            <i class="bi bi-funnel-fill" style="color:var(--primary);"></i> Filters
            <button onclick="clearFilters()" style="margin-left:auto;font-size:12px;color:var(--primary);background:none;border:none;cursor:pointer;font-weight:600;">Clear All</button>
          </h5>

          <!-- Price Range -->
          <div class="filter-group">
            <div class="filter-group-title">
              <span>Price Range</span>
              <i class="bi bi-chevron-down"></i>
            </div>
            <div class="price-range">
              <input type="range" id="price-max" min="0" max="100000" value="100000" step="500">
              <div class="price-inputs">
                <input type="text" class="price-input" id="price-min-display" value="৳0" readonly>
                <span class="price-sep">—</span>
                <input type="text" class="price-input" id="price-max-display" value="৳1,00,000" readonly>
              </div>
            </div>
          </div>

          <!-- Brand Filter -->
          <div class="filter-group">
            <div class="filter-group-title">
              <span>Brands</span>
              <i class="bi bi-chevron-down"></i>
            </div>
            <div class="filter-checkbox-list">
              <label class="filter-check"><input type="checkbox" onchange="applyFilter()"> Asia Paint <span class="count">23</span></label>
              <label class="filter-check"><input type="checkbox" onchange="applyFilter()"> Berger Paints <span class="count">18</span></label>
              <label class="filter-check"><input type="checkbox" onchange="applyFilter()"> RFL <span class="count">45</span></label>
              <label class="filter-check"><input type="checkbox" onchange="applyFilter()"> BSRM <span class="count">12</span></label>
              <label class="filter-check"><input type="checkbox" onchange="applyFilter()"> Eco Ceramics <span class="count">34</span></label>
              <label class="filter-check"><input type="checkbox" onchange="applyFilter()"> Mostafa Door <span class="count">9</span></label>
            </div>
          </div>

          <!-- Rating Filter -->
          <div class="filter-group">
            <div class="filter-group-title">
              <span>Rating</span>
              <i class="bi bi-chevron-down"></i>
            </div>
            <div class="filter-checkbox-list">
              <label class="filter-check"><input type="checkbox" onchange="applyFilter()">
                <span style="color:var(--accent);">★★★★★</span> 5 Stars
              </label>
              <label class="filter-check"><input type="checkbox" onchange="applyFilter()">
                <span style="color:var(--accent);">★★★★</span> 4+ Stars
              </label>
              <label class="filter-check"><input type="checkbox" onchange="applyFilter()">
                <span style="color:var(--accent);">★★★</span> 3+ Stars
              </label>
            </div>
          </div>

          <!-- Availability -->
          <div class="filter-group">
            <div class="filter-group-title">
              <span>Availability</span>
              <i class="bi bi-chevron-down"></i>
            </div>
            <div class="filter-checkbox-list">
              <label class="filter-check"><input type="checkbox" onchange="applyFilter()"> In Stock <span class="count">89</span></label>
              <label class="filter-check"><input type="checkbox" onchange="applyFilter()"> On Sale <span class="count">34</span></label>
            </div>
          </div>
        </div>
      </div>

      <!-- PRODUCTS -->
      <div class="col-lg-9">
        <!-- Toolbar -->
        <div style="background:white;border-radius:12px;padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow-sm);">
          <span style="font-size:14px;color:var(--gray-600);" id="product-count">Showing all products</span>
          <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
            <!-- Mobile Filter -->
            <button class="d-lg-none" onclick="showFilterDrawer()" style="padding:8px 14px;border:2px solid var(--gray-200);border-radius:8px;background:white;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;">
              <i class="bi bi-funnel"></i> Filter
            </button>
            <!-- Sort -->
            <select onchange="sortProducts(this.value)" style="padding:8px 14px;border:2px solid var(--gray-200);border-radius:8px;font-size:13px;color:var(--gray-700);outline:none;cursor:pointer;">
              <option value="default">Default</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Best Rating</option>
              <option value="newest">Newest First</option>
            </select>
            <!-- View Toggle -->
            <div style="display:flex;border:2px solid var(--gray-200);border-radius:8px;overflow:hidden;">
              <button id="grid-view-btn" onclick="setView('grid')" style="padding:8px 12px;border:none;background:var(--primary);color:white;cursor:pointer;">
                <i class="bi bi-grid-3x3-gap-fill"></i>
              </button>
              <button id="list-view-btn" onclick="setView('list')" style="padding:8px 12px;border:none;background:white;color:var(--gray-600);cursor:pointer;">
                <i class="bi bi-list-ul"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Products Grid -->
        <div id="products-container" class="products-grid"></div>

        <!-- Pagination -->
        <div style="display:flex;justify-content:center;margin-top:40px;">
          <div class="pagination-custom">
            <button class="page-btn" disabled><i class="bi bi-chevron-left"></i></button>
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <span style="padding:0 8px;color:var(--gray-400);">...</span>
            <button class="page-btn">12</button>
            <button class="page-btn"><i class="bi bi-chevron-right"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- MOBILE FILTER DRAWER -->
<div class="filter-drawer" id="filter-drawer">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
    <h5 style="margin:0;font-weight:700;"><i class="bi bi-funnel-fill me-2" style="color:var(--primary);"></i>Filters</h5>
    <button onclick="closeFilterDrawer()" style="background:var(--gray-100);border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;"><i class="bi bi-x"></i></button>
  </div>
  <div class="filter-group">
    <div class="filter-group-title">Price Range</div>
    <input type="range" min="0" max="100000" value="100000" step="500">
  </div>
  <div class="filter-group">
    <div class="filter-group-title">Brands</div>
    <div class="filter-checkbox-list">
      <label class="filter-check"><input type="checkbox"> Asia Paint</label>
      <label class="filter-check"><input type="checkbox"> Berger Paints</label>
      <label class="filter-check"><input type="checkbox"> RFL</label>
      <label class="filter-check"><input type="checkbox"> BSRM</label>
    </div>
  </div>
  <div style="margin-top:20px;display:flex;gap:8px;">
    <button onclick="closeFilterDrawer()" style="flex:1;padding:12px;background:var(--primary);color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer;">Apply Filters</button>
    <button onclick="closeFilterDrawer()" style="flex:1;padding:12px;background:var(--gray-100);color:var(--gray-700);border:none;border-radius:8px;font-weight:700;cursor:pointer;">Clear</button>
  </div>
</div>
<div class="mobile-menu-overlay" id="filter-overlay" onclick="closeFilterDrawer()"></div>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data/products.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
renderSharedComponents('products');

document.addEventListener('DOMContentLoaded', async () => {
  // Get URL params
  const params = new URLSearchParams(window.location.search);
  const category = params.get('category');
  const brand = params.get('brand');
  const search = params.get('search');

  // Update title
  if (category) {
    const catName = DUMMY_DATA.categories.find(c => c.slug === category)?.name || category;
    document.getElementById('page-title').textContent = catName;
    document.getElementById('bread-current').textContent = catName;
    document.title = `${catName} - Easycon BD`;
  } else if (search) {
    document.getElementById('page-title').textContent = `Search: "${search}"`;
    document.getElementById('bread-current').textContent = `Search`;
    document.title = `Search: ${search} - Easycon BD`;
  } else if (brand) {
    const brandName = DUMMY_DATA.brands.find(b => b.slug === brand)?.name || brand;
    document.getElementById('page-title').textContent = `${brandName} Products`;
    document.getElementById('bread-current').textContent = brandName;
  }

  await loadProductsToGrid('products-container', { category, brand, search });

  const products = DUMMY_DATA.products;
  const filtered = category ? products.filter(p => p.category === category) :
                   brand ? products.filter(p => p.slug.includes(brand)) :
                   products;
  document.getElementById('product-count').textContent = `Showing ${filtered.length} products`;
});

function setView(type) {
  const container = document.getElementById('products-container');
  const gridBtn = document.getElementById('grid-view-btn');
  const listBtn = document.getElementById('list-view-btn');
  
  if (type === 'grid') {
    container.className = 'products-grid';
    gridBtn.style.background = 'var(--primary)';
    gridBtn.style.color = 'white';
    listBtn.style.background = 'white';
    listBtn.style.color = 'var(--gray-600)';
  } else {
    container.className = 'd-flex flex-column gap-3';
    container.querySelectorAll('.product-card').forEach(card => {
      card.className = 'product-list-card product-card product-card-shine';
    });
    listBtn.style.background = 'var(--primary)';
    listBtn.style.color = 'white';
    gridBtn.style.background = 'white';
    gridBtn.style.color = 'var(--gray-600)';
  }
}

function sortProducts(type) {
  showToast('Sorting...', 'info');
}

function applyFilter() {
  showToast('Filters applied', 'info');
}

function clearFilters() {
  document.querySelectorAll('.filter-check input').forEach(cb => cb.checked = false);
  showToast('Filters cleared', 'info');
}

function showFilterDrawer() {
  document.getElementById('filter-drawer').classList.add('open');
  document.getElementById('filter-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeFilterDrawer() {
  document.getElementById('filter-drawer').classList.remove('open');
  document.getElementById('filter-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
</script>
</body>
</html>
