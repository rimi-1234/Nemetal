<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist - Easycon BD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e84610'/><text y='72' x='12' font-size='68' font-weight='900' fill='white' font-family='sans-serif'>E</text></svg>">
</head>
<body>
<div id="mobile-menu-placeholder"></div>
<div id="cart-drawer-placeholder"></div>
<div id="header-placeholder"></div>

<div class="page-banner">
  <div class="container-xl">
    <h1><i class="bi bi-heart-fill me-3" style="color:var(--primary);"></i>My Wishlist</h1>
    <ul class="breadcrumb-custom"><li><a href="index.html">Home</a></li><li class="active">Wishlist</li></ul>
  </div>
</div>

<section class="section">
  <div class="container-xl">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
      <h2 style="font-size:18px;font-weight:700;margin:0;" id="wishlist-title">Your Wishlist</h2>
      <div style="display:flex;gap:10px;">
        <button onclick="addAllToCart()" class="btn-primary-custom" style="padding:10px 20px;font-size:13px;">
          <i class="bi bi-cart-plus me-2"></i>Add All to Cart
        </button>
        <button onclick="wishlistManager.clear()" class="btn-outline-primary-custom" style="padding:10px 20px;font-size:13px;" id="clear-wishlist-btn">
          <i class="bi bi-trash3 me-2"></i>Clear All
        </button>
      </div>
    </div>

    <div id="wishlist-container"></div>
  </div>
</section>

<!-- Recommended -->
<section class="section section-bg-white" style="padding-top:0;">
  <div class="container-xl">
    <div class="section-header">
      <div class="section-title-group">
        <span class="section-label">You Might Like</span>
        <h2 class="section-title">Recommended Products</h2>
      </div>
    </div>
    <div id="recommended-products" class="products-grid"></div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data/products.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
renderSharedComponents('');
document.addEventListener('DOMContentLoaded', async () => {
  wishlistManager.updateUI();
  const count = wishlistManager.wishlist.length;
  document.getElementById('wishlist-title').textContent = `Your Wishlist (${count} item${count !== 1 ? 's' : ''})`;
  await loadProductsToGrid('recommended-products', { featured: true });
});

function addAllToCart() {
  wishlistManager.wishlist.forEach(item => cartManager.addItem(item, 1));
  showToast('All items added to cart!', 'success');
}
</script>
</body>
</html>
