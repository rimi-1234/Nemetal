<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order - Easycon BD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e84610'/><text y='72' x='12' font-size='68' font-weight='900' fill='white' font-family='sans-serif'>E</text></svg>">
</head>
<body>
<div id="mobile-menu-placeholder"></div>
<div id="cart-drawer-placeholder"></div>
<div id="header-placeholder"></div>

<div class="page-banner">
  <div class="container-xl">
    <h1><i class="bi bi-geo-alt-fill me-3" style="color:var(--primary);"></i>Track Your Order</h1>
    <ul class="breadcrumb-custom"><li><a href="index.html">Home</a></li><li class="active">Track Order</li></ul>
  </div>
</div>

<section class="section">
  <div class="container-xl">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <!-- Search Box -->
        <div style="background:white;border-radius:20px;padding:32px;box-shadow:var(--shadow-lg);margin-bottom:32px;" class="reveal">
          <h4 style="font-size:20px;font-weight:800;margin-bottom:8px;"><i class="bi bi-search me-2" style="color:var(--primary);"></i>Enter Order Details</h4>
          <p style="font-size:14px;color:var(--gray-500);margin-bottom:24px;">Enter your Order ID or Tracking Number to get real-time updates.</p>
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <div style="flex:1;min-width:200px;position:relative;">
              <input type="text" id="track-input" class="form-control-custom" placeholder="Order ID (e.g. EC-2024-001) or Tracking No." 
                value="" style="padding-left:44px;" onkeydown="if(event.key==='Enter')trackOrder()">
              <i class="bi bi-box-seam" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray-400);pointer-events:none;"></i>
            </div>
            <button class="btn-primary-custom" onclick="trackOrder()" style="padding:12px 28px;">
              <i class="bi bi-search me-2"></i>Track Now
            </button>
          </div>
          <div style="margin-top:12px;font-size:12px;color:var(--gray-400);">
            <i class="bi bi-lightbulb me-1"></i>Try: <strong>EC-2024-001</strong> or <strong>TRK123456789</strong>
          </div>
        </div>

        <!-- Result -->
        <div id="track-result" class="d-none reveal">
          <!-- Filled by JS -->
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data/products.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
renderSharedComponents('');

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('order');
  if (orderId) {
    document.getElementById('track-input').value = orderId;
    trackOrder();
  }
});

async function trackOrder() {
  const input = document.getElementById('track-input').value.trim();
  if (!input) { showToast('Please enter an Order ID', 'warning'); return; }

  const btn = document.querySelector('[onclick="trackOrder()"]');
  btn.innerHTML = '<span class="spinner-custom spinner-sm me-2"></span>Tracking...';
  btn.disabled = true;

  try {
    const result = await api.trackOrder(input);
    const data = result.data;
    renderTrackResult(data);
    showToast('Order found!', 'success');
  } catch (e) {
    showToast('Order not found', 'error', 'Please check your Order ID or Tracking Number.');
    document.getElementById('track-result').classList.add('d-none');
  } finally {
    btn.innerHTML = '<i class="bi bi-search me-2"></i>Track Now';
    btn.disabled = false;
  }
}

function renderTrackResult(data) {
  const statusMap = { pending: 'warning', processing: 'info', shipped: 'primary', delivered: 'success', cancelled: 'danger' };
  const result = document.getElementById('track-result');

  result.innerHTML = `
    <!-- Order Header -->
    <div style="background:white;border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);margin-bottom:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div>
          <div style="font-size:13px;color:var(--gray-500);">Order ID</div>
          <div style="font-size:20px;font-weight:900;color:var(--gray-900);">${data.id}</div>
        </div>
        <div>
          <div style="font-size:13px;color:var(--gray-500);">Date</div>
          <div style="font-size:14px;font-weight:600;">${data.date}</div>
        </div>
        <div>
          <div style="font-size:13px;color:var(--gray-500);">Total</div>
          <div style="font-size:18px;font-weight:800;color:var(--primary);">৳${data.total?.toLocaleString()}</div>
        </div>
        <div>
          <span class="order-badge ${data.status}" style="font-size:14px;padding:8px 20px;">
            ${data.status?.charAt(0).toUpperCase() + data.status?.slice(1)}
          </span>
        </div>
      </div>
    </div>

    <!-- Timeline -->
    <div style="background:white;border-radius:16px;padding:28px;box-shadow:var(--shadow-sm);">
      <h5 style="font-weight:700;margin-bottom:24px;"><i class="bi bi-list-check me-2" style="color:var(--primary);"></i>Delivery Timeline</h5>
      <div class="track-timeline">
        ${data.timeline.map((step, i) => `
          <div class="timeline-item ${step.completed ? 'completed' : i === data.timeline.filter(s=>s.completed).length ? 'active' : ''}">
            <div class="timeline-dot">
              ${step.completed ? '<i class="bi bi-check-lg"></i>' : (i + 1)}
            </div>
            <div class="timeline-content">
              <h6>${step.status}</h6>
              ${step.completed ? `<time>${step.time}</time>` : '<p style="color:var(--gray-400);">Pending</p>'}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  result.classList.remove('d-none');
  result.classList.add('animate-fadeInUp');
  setTimeout(() => result.classList.remove('animate-fadeInUp'), 500);
}
</script>
</body>
</html>
