<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Categories - Easycon BD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e84610'/><text y='72' x='12' font-size='68' font-weight='900' fill='white' font-family='sans-serif'>E</text></svg>">
</head>
<body>
<div id="mobile-menu-placeholder"></div>
<div id="cart-drawer-placeholder"></div>
<div id="header-placeholder"></div>

<!-- PAGE BANNER -->
<div class="page-banner">
  <div class="container-xl">
    <h1><i class="bi bi-grid-fill me-3" style="color:var(--primary);"></i>All Categories</h1>
    <ul class="breadcrumb-custom">
      <li><a href="index.html">Home</a></li>
      <li class="active">All Categories</li>
    </ul>
  </div>
</div>

<!-- CATEGORIES -->
<section class="section">
  <div class="container-xl">
    <div class="row g-4">
      <!-- Category Cards -->
      <div class="col-12">
        <div class="row g-3" id="categories-grid">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data/products.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/main.js"></script>
<script src="js/components.js"></script>
<script>
renderSharedComponents('categories');

document.addEventListener('DOMContentLoaded', () => {
  const cats = DUMMY_DATA.categories;
  const iconMap = {'construction-chemical':'bi-flask','cement-aggregate':'bi-layers','tmt-steel-bar':'bi-tools','bricks-blocks':'bi-bricks','doors':'bi-door-closed','door-fittings':'bi-key','electric-materials':'bi-lightning','pipe-fitting':'bi-pipe','sanitary-ware':'bi-droplet','paint-coating':'bi-palette','tiles-flooring':'bi-grid','safety-equipment':'bi-shield'};
  const colors = ['#e84610','#1b2a4a','#374151','#b45309','#065f46','#6d28d9','#d97706','#0369a1','#0891b2','#7c3aed','#b91c1c','#059669'];

  document.getElementById('categories-grid').innerHTML = cats.map((cat, i) => `
    <div class="col-6 col-md-4 col-lg-3">
      <a href="product-listing.html?category=${cat.slug}" class="text-decoration-none">
        <div class="feature-card hover-glow" style="border-top:4px solid ${colors[i%colors.length]};">
          <div class="icon-wrap" style="background:${colors[i%colors.length]}15;color:${colors[i%colors.length]};font-size:36px;">
            ${cat.icon}
          </div>
          <h4>${cat.name}</h4>
          <p style="font-size:13px;color:var(--gray-500);">${cat.count} Products Available</p>
          <span style="font-size:12px;font-weight:600;color:${colors[i%colors.length]};">Browse Now →</span>
        </div>
      </a>
    </div>
  `).join('');

  // Re-init animations
  initScrollAnimations();
});
</script>
</body>
</html>
